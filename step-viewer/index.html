const root=new THREE.Group();root.rotation.x=-Math.PI/2;sc.add(root);root.add(A,B);
function view(v){B.visible=(v=='asm'||v=='exp');A.rotation.set(0,0,0);A.position.set(0,0,0);

document.querySelectorAll('button[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));
